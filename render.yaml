# Render Blueprint: the public SHOWCASE demo of Ryuu on Render's free plan.
# Demo accounts, synthetic data, uploads off, placeholder branding.
# A real launch uses docs/DEPLOYMENT.md instead (SHOWCASE_MODE must be off).
#
# Why a separate database: the embedded PGlite database peaks at ~830 MB while it starts,
# above the free web plan's 512 MB, so the demo uses Render's free PostgreSQL
# (free databases expire after 30 days; create a new one then) and the lean standalone server.
databases:
  - name: ryuu-hostel-demo-db
    plan: free
    region: singapore
    databaseName: ryuu
    user: ryuu

services:
  - type: web
    name: ryuu-hostel-demo
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: DATABASE_URL
        fromDatabase:
          name: ryuu-hostel-demo-db
          property: connectionString
      - key: SHOWCASE_MODE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: PHONEPE_SIMULATE
        value: "true"
      - key: NEXT_PUBLIC_OWNER_BRANDING
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: APP_URL
        value: https://ryuu-hostel-demo.onrender.com
